[project]
name = "amb-research-01"
version = "0.1.0"
description = "amb research · Report 01: what Polish households lose through the way they save"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "openpyxl>=3.1", "numpy>=2.0", "scipy>=1.13", "matplotlib>=3.9", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]
